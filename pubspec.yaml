name: mavio
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  flutter_background_service: ^5.0.6
  flutter_local_notifications: ^17.2.2
  intl: ^0.19.0
  file_picker: ^8.1.2
  excel: ^4.0.6
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - logo.png
    - dashboard_bg.png
    - mavio_bus.png
    - company-logo.png
    - assets/home.png
    - assets/driver.png
    - assets/3.png
    - assets/4.png
    - assets/5.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo_padded.png"
  background_color: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "logo_padded.png"
