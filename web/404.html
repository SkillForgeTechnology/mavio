<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Oops! You took the wrong route | MAVIO</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #1F2937;
      overflow-x: hidden;
      position: relative;
    }
    .wave-left {
      position: absolute;
      bottom: -40px;
      left: -60px;
      width: 340px;
      height: 220px;
      background: linear-gradient(135deg, rgba(255, 154, 98, 0.55) 0%, rgba(255, 87, 34, 0.20) 100%);
      border-top-right-radius: 220px;
      pointer-events: none;
      z-index: 0;
    }
    .wave-right {
      position: absolute;
      bottom: -50px;
      right: -60px;
      width: 380px;
      height: 240px;
      background: linear-gradient(135deg, rgba(255, 87, 34, 0.90) 0%, rgba(255, 138, 0, 0.70) 100%);
      border-top-left-radius: 240px;
      pointer-events: none;
      z-index: 0;
    }
    header {
      position: relative;
      z-index: 10;
      padding: 20px 64px;
    }
    @media (max-width: 768px) {
      header {
        padding: 16px 24px;
      }
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      background: #FFF0E6;
      border: 1px solid #FFD5C0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .brand-name {
      font-size: 20px;
      font-weight: 900;
      color: #1F2937;
      letter-spacing: 1.2px;
    }
    main {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 64px;
      max-width: 1320px;
      margin: 0 auto;
      width: 100%;
    }
    .grid {
      display: grid;
      grid-template-columns: 0.95fr 1.25fr;
      gap: 32px;
      align-items: center;
      width: 100%;
    }
    @media (max-width: 900px) {
      main {
        padding: 20px 24px;
      }
      .grid {
        grid-template-columns: 1fr;
        gap: 24px;
        text-align: center;
      }
    }
    .hero-404 {
      position: relative;
      display: inline-block;
      font-size: 92px;
      font-weight: 900;
      color: #FF5722;
      letter-spacing: -2px;
      line-height: 0.95;
      margin-bottom: 16px;
    }
    .rays {
      position: absolute;
      top: -4px;
      right: -28px;
      display: flex;
      gap: 4px;
    }
    .ray-1 {
      width: 10px;
      height: 3.5px;
      background: #FF9A62;
      border-radius: 2px;
    }
    .ray-2 {
      width: 16px;
      height: 3.5px;
      background: #FF5722;
      border-radius: 2px;
    }
    h1 {
      font-size: 36px;
      font-weight: 900;
      color: #1F2937;
      letter-spacing: -0.6px;
      line-height: 1.2;
      margin-bottom: 14px;
    }
    h1 span {
      color: #FF5722;
    }
    .desc {
      font-size: 15px;
      line-height: 1.5;
      color: #6B7280;
      margin-bottom: 22px;
    }
    .quote-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #FFF7F2;
      border: 1px solid #FFE0D0;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      color: #D84315;
      margin-bottom: 28px;
      text-align: left;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 260px;
      height: 52px;
      background: #FF5722;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(255, 87, 34, 0.35);
      transition: transform 0.2s, background 0.2s;
    }
    .btn-home:hover {
      background: #E64A19;
      transform: translateY(-2px);
    }
    .illustration-box {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .illustration-box img {
      width: 100%;
      height: auto;
      max-height: 540px;
      object-fit: contain;
    }
    footer {
      position: relative;
      z-index: 10;
      padding: 0 24px 24px 24px;
      display: flex;
      justify-content: center;
    }
    .support-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #FFFFFF;
      border: 1px solid #FFE0D0;
      border-radius: 18px;
      padding: 12px 20px;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 4px 18px rgba(255, 87, 34, 0.08);
      text-align: left;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s;
    }
    .support-card:hover {
      transform: translateY(-2px);
    }
    .support-icon {
      width: 36px;
      height: 36px;
      background: #FFF0E6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .support-text {
      flex: 1;
    }
    .support-title {
      font-size: 13px;
      font-weight: 800;
      color: #1F2937;
    }
    .support-sub {
      font-size: 11px;
      color: #6B7280;
    }
    .support-link {
      font-size: 12px;
      font-weight: 700;
      color: #FF5722;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div class="wave-left"></div>
  <div class="wave-right"></div>

  <header>
    <a href="/" class="brand">
      <div class="brand-icon">🚌</div>
      <span class="brand-name">MAVIO</span>
    </a>
  </header>

  <main>
    <div class="grid">
      <div>
        <div class="hero-404">
          404
          <div class="rays">
            <div class="ray-1"></div>
            <div class="ray-2"></div>
          </div>
        </div>

        <h1>Oops! You took<br><span>the wrong route.</span></h1>

        <p class="desc">The page you're looking for seems to have taken a different destination.</p>

        <div class="quote-box">
          <span>🚌</span>
          <span>Don't worry, even the best journeys have a wrong turn sometimes.</span>
        </div>

        <div>
          <a href="/" class="btn-home">🏠 Back to Home</a>
        </div>
      </div>

      <div class="illustration-box">
        <img src="404_bus_signpost.png" alt="MAVIO Signpost and Transit Bus">
      </div>
    </div>
  </main>

  <footer>
    <a href="https://wa.me/919345518760?text=Hi%2C%20I'm%20interested%20in%20Mavio%20Transit%20Service!" target="_blank" class="support-card">
      <div class="support-icon">🎧</div>
      <div class="support-text">
        <div class="support-title">Still need help?</div>
        <div class="support-sub">Our support team is always here for you.</div>
      </div>
      <div class="support-link">Contact Support →</div>
    </a>
  </footer>
</body>
</html>
